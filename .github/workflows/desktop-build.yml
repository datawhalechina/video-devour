name: Desktop Build

# 桌面客户端样包构建（阶段 A3/A4 验证 + 后续发行）
#
# 触发：
#   - 手动触发（workflow_dispatch）
#   - 推送 desktop/ 或依赖清单变更
#   - 打 tag（v*）时构建并上传产物
#
# 说明：Windows 打包必须在真实 Windows runner 上验证
#（方案 6.1：不在单平台成功后才发现另一平台的打包约束）。

on:
  workflow_dispatch:
  push:
    branches: [main, "feat/**", "fix/**", "ci/**"]
    paths:
      - "desktop/**"
      - "requirements-lite.txt"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/desktop-build.yml"
    tags: ["v*"]
  pull_request:
    paths:
      - "desktop/**"
      - "requirements-lite.txt"

jobs:
  # macOS 双架构：arm64 用 Apple Silicon runner，x86_64 用 Intel runner。
  # 不在 arm64 上用 Rosetta 构建 x86_64——CI runner 无 Rosetta，且原生构建更可靠。
  build-macos-arm64:
    name: macOS arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lite.txt pyinstaller pywebview

      - name: 构建前端
        run: |
          cd frontend
          npm ci || npm install
          npm run build

      - name: 获取静态 ffmpeg（arm64）
        run: |
          bash desktop/fetch_binaries.sh macos-arm64
          file desktop/bin/macos-arm64/ffmpeg

      - name: 打包 .app
        run: |
          chmod +x desktop/build_mac.sh
          PYTHON_ARM64=python ./desktop/build_mac.sh --arm64 --sign

      - name: 冒烟测试（后端启动 + health）
        run: |
          ./desktop/dist/arm64/VideoDevour.app/Contents/Resources/VideoDevour --backend-only \
            --port 0 --data-dir "$RUNNER_TEMP/vd-data" \
            --handshake-file "$RUNNER_TEMP/hs.json" > /dev/null 2>&1 &
          for i in $(seq 1 90); do [ -f "$RUNNER_TEMP/hs.json" ] && break; sleep 1; done
          PORT=$(python -c "import json;print(json.load(open('$RUNNER_TEMP/hs.json'))['port'])")
          curl -f "http://127.0.0.1:$PORT/api/health"
          curl -f -o /dev/null "http://127.0.0.1:$PORT/"

      - name: 校验架构
        run: file desktop/dist/arm64/VideoDevour.app/Contents/Resources/VideoDevour

      - name: 记录体积
        run: du -sh desktop/dist/arm64/VideoDevour.app

      - uses: actions/upload-artifact@v4
        with:
          name: VideoDevour-macos-arm64
          path: desktop/dist/arm64/VideoDevour.app
          retention-days: 14

  build-macos-x64:
    name: macOS x86_64 (Intel)
    # macos-13 已被 GitHub 弃用（job 会永久 queued）；当前 Intel runner 为 macos-15-intel
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lite.txt pyinstaller pywebview

      - name: 构建前端
        run: |
          cd frontend
          npm ci || npm install
          npm run build

      - name: 获取静态 ffmpeg（x86_64）
        run: |
          bash desktop/fetch_binaries.sh macos-x64
          file desktop/bin/macos-x64/ffmpeg

      - name: 打包 .app
        run: |
          chmod +x desktop/build_mac.sh
          PYTHON_X64=python ./desktop/build_mac.sh --x64 --sign

      - name: 冒烟测试（后端启动 + health）
        run: |
          ./desktop/dist/x64/VideoDevour.app/Contents/Resources/VideoDevour --backend-only \
            --port 0 --data-dir "$RUNNER_TEMP/vd-data" \
            --handshake-file "$RUNNER_TEMP/hs.json" > /dev/null 2>&1 &
          for i in $(seq 1 90); do [ -f "$RUNNER_TEMP/hs.json" ] && break; sleep 1; done
          PORT=$(python -c "import json;print(json.load(open('$RUNNER_TEMP/hs.json'))['port'])")
          curl -f "http://127.0.0.1:$PORT/api/health"
          curl -f -o /dev/null "http://127.0.0.1:$PORT/"

      - name: 校验架构与 cryptography（x64 曾因 OpenSSL 符号缺失失败）
        run: |
          file desktop/dist/x64/VideoDevour.app/Contents/Resources/VideoDevour
          python - <<'PY'
          import glob
          so = glob.glob("desktop/dist/x64/VideoDevour.app/Contents/Resources/_internal/cryptography/hazmat/bindings/_rust.abi3.so")
          assert so, "缺少 cryptography rust binding"
          print("cryptography binding 已打包:", so[0])
          PY

      - name: 记录体积
        run: du -sh desktop/dist/x64/VideoDevour.app

      - uses: actions/upload-artifact@v4
        with:
          name: VideoDevour-macos-x64
          path: desktop/dist/x64/VideoDevour.app
          retention-days: 14

  build-windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lite.txt pyinstaller pywebview

      - name: 构建前端
        run: |
          cd frontend
          npm ci || npm install
          npm run build

      - name: 获取静态 ffmpeg（win64）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "desktop/bin/windows-x64" | Out-Null
          Invoke-WebRequest -Uri "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffmpeg-win32-x64" -OutFile "desktop/bin/windows-x64/ffmpeg.exe"
          Invoke-WebRequest -Uri "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffprobe-win32-x64" -OutFile "desktop/bin/windows-x64/ffprobe.exe"

      - name: 安装 Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          # choco 安装在 Program Files (x86)，加入 PATH 供 ISCC 调用
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" -ErrorAction SilentlyContinue
          if (-not $iscc) { throw "Inno Setup 安装失败" }
          Write-Host "ISCC: $($iscc.FullName)"

      - name: 打包（含安装包）
        shell: pwsh
        run: |
          $env:PYTHON = "python"
          $env:PATH = "C:\Program Files (x86)\Inno Setup 6;$env:PATH"
          powershell -ExecutionPolicy Bypass -File desktop/build_win.ps1
          # 显式校验安装包产物，避免"回显成功但实际未生成"
          $setup = Get-ChildItem desktop/dist -Filter "*-setup.exe"
          if (-not $setup) { throw "未生成 Windows 安装包" }
          Write-Host "安装包: $($setup.Name) ($([math]::Round($setup.Length/1MB,1)) MB)"

      - name: 冒烟测试（后端启动 + health）
        shell: pwsh
        run: |
          $hs = "$env:RUNNER_TEMP\hs.json"
          $data = "$env:RUNNER_TEMP\vd-data"
          $p = Start-Process -FilePath "desktop\dist\VideoDevour\VideoDevour.exe" `
            -ArgumentList "--backend-only","--port","0","--data-dir",$data,"--handshake-file",$hs `
            -PassThru -NoNewWindow
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) { if (Test-Path $hs) { $ok = $true; break }; Start-Sleep 1 }
          if (-not $ok) { throw "后端未输出握手文件" }
          $port = (Get-Content $hs | ConvertFrom-Json).port
          Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/health" | ConvertTo-Json
          Invoke-WebRequest -Uri "http://127.0.0.1:$port/" -UseBasicParsing | Out-Null
          Stop-Process -Id $p.Id -Force

      - name: 记录体积
        shell: pwsh
        run: |
          $size = (Get-ChildItem -Recurse desktop/dist/VideoDevour | Measure-Object -Property Length -Sum).Sum
          Write-Host ("未压缩体积: {0:N1} MB" -f ($size / 1MB))

      - uses: actions/upload-artifact@v4
        with:
          name: VideoDevour-windows-x64-installer
          path: desktop/dist/*-setup.exe
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: VideoDevour-windows-x64
          path: desktop/dist/VideoDevour
          retention-days: 14
